name: CI

on:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Tests (mocks and real Windows calls)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
      - name: Build the single-file script
        shell: powershell
        run: .\build\Build-IntuneComplianceTool.ps1
      - name: Smoke test of the single-file script
        shell: powershell
        run: .\tests\SmokeTest.ps1 -Bundle (Resolve-Path .\dist\IntuneComplianceTool.ps1).Path

  windows-powershell-7:
    name: Windows PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Tests (mocks and real Windows calls)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  macos:
    name: macOS (ict.sh and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh {0}
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Tests
        shell: pwsh {0}
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
      - name: ict.sh with the system bash (3.2)
        run: /bin/bash tests/ict-sh.test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ict.sh
        run: shellcheck --severity=warning ict.sh tests/ict-sh.test.sh
